plugins {
    id 'com.android.application'
}

// 版本规则：
//   versionCode —— 每次打包由 package.sh 自增（记录在根目录 version.properties）
//   versionName —— 打包时刻 MM.dd.H.mm，如 2026-10-26 01:07 → 10.26.1.07
//   应用名称   —— "超级文件 N"，N 与 versionCode 同步递增
def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps.getProperty('versionCode') ?: '1').trim().toInteger()
def appVersionName = project.hasProperty('appVersionName')
        ? project.property('appVersionName')
        : new java.text.SimpleDateFormat('MM.dd.H.mm', Locale.CHINA).format(new Date())
def appLabel = "超级文件 " + appVersionCode

android {
    namespace 'com.lumen.files'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumen.files"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [appLabel: appLabel]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 刻意不引入任何第三方依赖：无 AndroidX、无 Kotlin、无图片库。
dependencies {
}
