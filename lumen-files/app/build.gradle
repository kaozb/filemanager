plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lumen.files'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumen.files"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 刻意不引入任何第三方依赖：无 AndroidX、无 Kotlin、无图片库。
dependencies {
}
